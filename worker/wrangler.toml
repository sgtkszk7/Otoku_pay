name = "otoku-pay-lookup"
main = "worker.js"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "LOOKUP"
class_name = "LookupCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LookupCoordinator"]

[vars]
# Set positive limits and both secrets before enabling paid searches.
USER_DAILY_CALLS = "0"
MONTHLY_CALLS = "0"
MONTHLY_BUDGET_CENTS = "0"
CALL_RESERVE_CENTS = "0"
