name: 還元率の自動チェック

on:
  schedule:
    - cron: "17 0 1 * *"   # 毎月1日 9:17（日本時間）
  workflow_dispatch:        # Actions タブから手動でも実行できる

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: 還元率をチェック（Claude で調査 → ChatGPT で検証）
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/check_rates.py

      - name: Pull Request を作成
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/rate-check
          delete-branch: true
          add-paths: data.json
          commit-message: "還元率データを自動更新（${{ steps.check.outputs.date }}）"
          title: "還元率の自動チェック（${{ steps.check.outputs.date }}）"
          body-path: check_report.md
